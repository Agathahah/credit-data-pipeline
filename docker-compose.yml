# Two services: PostgreSQL and the one-shot pipeline.
# Usage:
#   cp .env.example .env        # then edit the password
#   docker compose up --build   # runs the pipeline once and exits
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a local PostgreSQL
    volumes:
      # Volume name carries the major version: a data directory created by another
      # PostgreSQL major version cannot be opened ("database files are incompatible
      # with server"). v1 of this project used postgres:14 with a volume called
      # postgres_data; a new name means that old volume is never mounted here.
      - pgdata16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./models:/app/models

volumes:
  pgdata16:
