# The pipeline is a batch process: it runs once and exits. A Job (not a
# Deployment) is the right controller. The first version used a Deployment
# with restartPolicy: Always, which restarts the pipeline forever after it
# finishes. For a schedule, wrap this spec in a CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: credit-pipeline
  namespace: credit-pipeline
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting; sleep 3; done"]
      containers:
        - name: pipeline
          image: credit-data-pipeline:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: credit-pipeline-db}
          env:
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: CREDIT_CSV, value: /app/data/raw/cs-training.csv}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes:
        - name: data
          hostPath: {path: /data/credit-pipeline, type: DirectoryOrCreate}
