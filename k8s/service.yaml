# ============================================================
# service.yaml
# Service = cara Kubernetes mengekspos container ke jaringan
# Tanpa Service, Pod tidak bisa diakses dari Pod lain
#
# File ini mendefinisikan 2 service:
# 1. postgres-service: expose PostgreSQL ke dalam cluster
# 2. pipeline-service: expose monitoring port (opsional)
# ============================================================

---
# SERVICE 1: PostgreSQL
# Type ClusterIP = hanya bisa diakses dari dalam cluster
# Pipeline container akan connect ke "postgres-service:5432"
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ml-production
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres          # match label di postgres Deployment
  ports:
    - name: postgres
      protocol: TCP
      port: 5432           # port yang diexpose ke dalam cluster
      targetPort: 5432     # port di dalam container

---
# SERVICE 2: PostgreSQL Deployment
# Terpisah dari pipeline agar bisa scale independen
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ml-production
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: credit-pipeline-secret
                  key: db-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: credit-pipeline-secret
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credit-pipeline-secret
                  key: db-password
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# SECRET: menyimpan credentials dengan aman
# Nilai di-encode base64 (bukan enkripsi — untuk enkripsi pakai Vault)
# Cara generate: echo -n "nilai" | base64
apiVersion: v1
kind: Secret
metadata:
  name: credit-pipeline-secret
  namespace: ml-production
type: Opaque
data:
  db-name: Y3JlZGl0X3Jpc2tfZGI=      # credit_risk_db
  db-user: ZGF0YWVuZ2luZWVy          # dataengineer
  db-password: ZGVfcGFzc3dvcmQxMjM=  # de_password123

---
# NAMESPACE: isolasi environment
# Memisahkan ml-production dari namespace lain di cluster
apiVersion: v1
kind: Namespace
metadata:
  name: ml-production
  labels:
    environment: production
    team: data-science

---
# PERSISTENTVOLUMECLAIM: request storage
# Cluster akan menyediakan storage sesuai request
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: credit-data-pvc
  namespace: ml-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi        # minta 5GB storage untuk data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: credit-model-pvc
  namespace: ml-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi        # 1GB untuk menyimpan model artifacts

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ml-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi       # 10GB untuk database PostgreSQL
